<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>需求交付控制台</title><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/style.css"><script defer src="/lucide.js"></script><script defer src="/i18n.js"></script><script defer src="/app.js"></script><script defer src="/management.js"></script></head>
<body>
<aside class="sidebar"><div class="brand"><img src="/icon.png" alt=""><strong>交付控制台</strong></div><div class="workspace">本机工作区</div><nav><button class="nav active" data-view="all"><i data-lucide="layers"></i>全部需求 <span id="all-count"></span></button><button class="nav" data-view="decisions"><i data-lucide="circle-check"></i>决策待办 <span id="decision-count"></span></button><button class="nav" data-view="blocked"><i data-lucide="circle-alert"></i>阻塞事项 <span id="blocked-count"></span></button></nav><div class="sidebar-foot"><span class="dot"></span>本地存储 · 无生产执行权限</div></aside>
<main>
<header><div><div class="eyebrow">需求交付 / 工作区</div><h1 id="view-title">全部需求</h1></div><div class="actions"><button id="sync" hidden><i data-lucide="refresh-cw"></i>同步本机来源</button><button id="export" title="导出本机记录"><i data-lucide="download"></i></button><button class="primary" id="new"><i data-lucide="plus"></i>新建需求</button></div></header>
<section class="stats" id="stats"></section>
<section class="work"><section id="management" hidden></section><section id="intake-list" hidden></section><section id="detail" class="detail"></section></section>
<footer>版本与测试证据分开记录 <span>生产发布须单独授权</span></footer>
</main>
<dialog id="create-dialog"><form id="create-form"><div class="modal-head"><h2>新建需求</h2><button type="button" data-close title="关闭"><i data-lucide="x"></i></button></div><label>标题<input name="title" required maxlength="160" placeholder="例如：修复预约任务未按时启动"></label><div class="form-row"><label>项目<select name="project_id" required></select></label><label>类型<select name="kind"><option>需求</option><option>Bug</option></select></label></div><label>需求描述<textarea name="description" rows="3" maxlength="4000"></textarea></label><label>验收标准<textarea name="acceptance" rows="3" maxlength="4000"></textarea></label><div class="modal-actions"><button type="button" data-close>取消</button><button class="primary">创建</button></div></form></dialog>
<dialog id="catalog-dialog"><form id="catalog-form"><div class="modal-head"><h2 id="catalog-title">项目配置</h2><button type="button" data-close title="关闭"><i data-lucide="x"></i></button></div><div class="form-row"><label>名称<input name="name" required maxlength="80"></label><label id="collection-field">项目集<select name="collection_id"></select></label></div><section id="template-field"><h3>流程模板</h3><div class="template-mode"><label><input type="radio" name="template_mode" value="standard" checked>标准流程</label><label><input type="radio" name="template_mode" value="custom">自定义流程</label></div><div class="workflow-editor"><div id="template-nodes"></div><div id="node-properties"></div></div><button type="button" id="add-node" title="添加流程节点"><i data-lucide="plus"></i>节点</button></section><div class="modal-actions"><button type="button" data-close>取消</button><button class="primary">保存</button></div></form></dialog>
<dialog id="action-dialog"><form id="action-form"><div class="modal-head"><h2 id="action-title"></h2><button type="button" data-close title="关闭"><i data-lucide="x"></i></button></div><div id="action-fields"></div><div class="modal-actions"><button type="button" data-close>取消</button><button class="primary">保存记录</button></div></form></dialog>
<div id="toast" role="status"></div>
</body></html>
